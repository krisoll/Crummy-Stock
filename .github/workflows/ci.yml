name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch cancels the previous run â€” the older result is
# already stale by then, and CI minutes are better spent on the newer commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v5

      # The build runs on JDK 25: gradle/gradle-daemon-jvm.properties pins
      # toolchainVersion=25, and AGP 9 refuses to start on anything older.
      # `java-version-file` is not used because there is no .java-version here.
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The Robolectric tests inflate real layouts and read real string
      # resources, so the Android SDK is genuinely required â€” this is not a
      # pure-JVM unit test run. Keeping the suite on the JVM (rather than on an
      # emulator) is what makes it practical on hosted runners.
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # The HTML report is the only way to see *which* assertions failed
      # without digging through the log, so it is uploaded on failure rather
      # than only on success.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Deliberately non-blocking for now: the point is to surface new warnings
      # in the job summary. Gating on this from day one would block every pull
      # request on pre-existing lint debt.
      - name: Run lint
        continue-on-error: true
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

  assemble:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Compiling for real catches things unit tests cannot: resource problems,
      # manifest errors and R8 issues in the release pipeline. `assembleDebug`
      # is used rather than a release build so this never needs a signing key.
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
